[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight"
version = "0.1.0"
authors = [
  { name="LightWeight Team", email="team@lightweight.ai" },
]
description = "A high-performance inference engine for massive LLMs on consumer hardware."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "llama-cpp-python>=0.2.0",
    "numpy>=1.24.0",
]

[project.scripts]
lightweight = "lightweight.cli:app"
lw = "lightweight.cli:app"
