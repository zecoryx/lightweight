[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lightweight"
version = "0.1.0"
authors = [
  { name="LightWeight Team", email="team@lightweight.ai" },
]
description = "A high-performance inference engine for massive LLMs on consumer hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=13.595.0",
    "llama-cpp-python>=0.2.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "huggingface_hub>=0.16.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["lightweight*", "cli*"]

[project.scripts]
lightweight = "cli.cli:app"
lw = "cli.cli:app"
