name: Build LightWeight Binaries

on:
  push:
    branches: [ main, master ]
    paths:
      - 'cli/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'cli/**'
      - 'requirements.txt'
  workflow_dispatch: # Manuel ishga tushirish uchun

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: lightweight-windows-x86_64.exe
            asset_name: lightweight-windows-x86_64.exe
          - os: ubuntu-latest
            artifact_name: lightweight-linux-x86_64
            asset_name: lightweight-linux-x86_64
          - os: macos-latest
            artifact_name: lightweight-macos-x86_64
            asset_name: lightweight-macos-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: pyinstaller --onefile --name ${{ matrix.artifact_name }} cli/cli.py

      - name: Build with PyInstaller (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: pyinstaller --onefile --name ${{ matrix.artifact_name }} cli/cli.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 1
