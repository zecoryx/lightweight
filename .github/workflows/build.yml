name: Build LightWeight Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: lightweight-windows-x86_64.exe
            sep: ";"
          - os: ubuntu-latest
            artifact_name: lightweight-linux-x86_64
            sep: ":"
          - os: macos-latest
            artifact_name: lightweight-macos-arm64
            sep: ":"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip install .

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console \
          --name "${{ matrix.artifact_name }}" \
          --collect-all "llama_cpp" \
          --add-data "cli/hardware${{ matrix.sep }}hardware" \
          --add-data "cli/models${{ matrix.sep }}models" \
          --add-data "cli/inference${{ matrix.sep }}inference" \
          --add-data "cli/memory${{ matrix.sep }}memory" \
          --add-data "cli/strategy${{ matrix.sep }}strategy" \
          cli/cli.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 5
